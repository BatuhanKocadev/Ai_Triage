[pytest]
testpaths = tests
addopts = -q --strict-markers --cov=app --cov-branch --cov-fail-under=87 --cov-report=term-missing
markers =
    yavas: harici servis gerektirir (Ollama, Whisper modeli, Docker)
    entegrasyon: gercek Postgres/ChromaDB gerektirir
filterwarnings =
    error::DeprecationWarning:app.*
