# Proje adı sabitlendi: klasör adı değişse bile (Ai_Triage / Ai_Triage-myself)
# aynı konteyner ve volume'ler kullanılmaya devam eder, mevcut veri kaybolmaz.
name: ai_triage

services:
  chromadb:
    image: chromadb/chroma:latest
    container_name: ai_triage_chromadb
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE

  postgres:
    image: postgres:16-alpine
    container_name: ai_triage_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=triage
      - POSTGRES_PASSWORD=triage
      - POSTGRES_DB=ai_triage
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triage -d ai_triage"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ai_triage_backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      chromadb:
        condition: service_started
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - DATABASE_URL=postgresql+psycopg2://triage:triage@postgres:5432/ai_triage
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    volumes:
      - ./app:/app/app

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ai_triage_frontend
    restart: always
    ports:
      - "8501:8501"
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8000
    volumes:
      - ./frontend:/app/frontend

volumes:
  chroma_data:
    name: ai_triage_chroma_storage
  pg_data:
    name: ai_triage_pg_storage